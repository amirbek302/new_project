<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Document</title>
</head>
<body>
    {% load i18n %}
    {% get_current_language as LANGUAGE_CODE %}
    <nav>
        <div class="nav-a">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'interesting' %}">Interesting</a>

            {% if user.is_authenticated %}
                <span class="nav-username">Привет, {{ user.username }}!</span>
                <a href="{% url 'room' %}">Room</a>
                <form action="{% url 'logout' %}" method="POST" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Logout</button>
                </form>
            {% else %}

                <a href="{% url 'register' %}">Register</a>
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </div>
        <div class="nav-buttons">
            <form action="{% url 'set_language' %}" method="POST">
                {% csrf_token %}
                <select name="language" class="language-select">
                    <option value="en" {% if LANGUAGE_CODE == 'en' %} selected {% endif %}>English</option>
                    <option value="uz" {% if LANGUAGE_CODE == 'uz' %} selected {% endif %}>Uzbek</option>
                    <option value="ru" {% if LANGUAGE_CODE == 'ru' %} selected {% endif %}>Russian</option>
                </select>
                <input type="submit" value="Change" class="language-btn">
            </form>
            <div class="theme-picker">
                <select id="theme-select">
                    <option value="light">Light ☀️</option>
                    <option value="dark">Dark 🌙</option>
                    <option value="cyberpunk">Cyberpunk ⚡</option>
                </select>
            </div>
        </div>
    </nav>
    {% block content %}

    {% endblock %}

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
