<!doctype html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Document</title>
</head>
<body>
    {% load i18n %}
    <nav>
        <div class="nav-a">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'register' %}">Register</a>
            <a href="{% url 'out' %}">Out</a>
        </div>
        <div class="nav-buttons">
            <form action="{% url 'set_language' %}" method="POST">{% csrf_token %}<select name="language">
                <option value="en" selected>English</option>
                <option value="uz">Uzbek</option>
                <option value="ru">Rusian</option>
            </select><input type="submit" value="Change language">
            </form>
            <form class="theme-picker">
                <fieldset>
                  <legend class="visually-hidden">Choose a color theme</legend>

                  <label class="theme-option">
                    <input type="radio" name="theme" value="light" checked>
                    <span>Light</span>
                  </label>

                  <label class="theme-option">
                    <input type="radio" name="theme" value="dark">
                    <span>Dark</span>
                  </label>

                  <label class="theme-option">
                    <input type="radio" name="theme" value="cyberpunk">
                    <span>Cyberpunk</span>
                  </label>
                </fieldset>
            </form>
            <button>🌙</button>
        </div>
    </nav>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
